name: check-and-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: test -f index.html
      - run: grep -q "<title>" index.html
      - name: Your own name must be in it
        run: |
          if grep -qi "YOUR NAME" index.html; then
            echo "You have not put your name in index.html yet."
            exit 1
          fi

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Show what a variable and a secret look like in a log
        run: |
          echo "variable is readable : ${{ vars.SITE_TAGLINE }}"
          echo "secret is masked     : ${{ secrets.BOARD_KEY }}"

      - name: Put the variable into the page
        run: sed -i "s|DATAEKO &middot; Week 3|${{ vars.SITE_TAGLINE }}|" index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
